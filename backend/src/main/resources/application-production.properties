# Production composes the PostgreSQL profile through the profile group in
# application.properties. This file contains only production-specific web
# security behavior, not duplicate datasource or schema settings.
server.servlet.session.cookie.secure=${HEALTHAITRACKER_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Same-origin production requires no CORS mapping by default. A specific
# allow-list may still be supplied without permitting wildcard origins.
app.cors.allowed-origins=${HEALTHAITRACKER_CORS_ALLOWED_ORIGINS:}
