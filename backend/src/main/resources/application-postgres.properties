# PostgreSQL runtime profile. Supply all connection details through the
# environment; no credentials or deployment-specific defaults belong here.
spring.datasource.url=${HEALTHAITRACKER_DATABASE_URL}
spring.datasource.username=${HEALTHAITRACKER_DATABASE_USERNAME}
spring.datasource.password=${HEALTHAITRACKER_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway is the only schema owner for PostgreSQL. Hibernate validates the
# completed V1 -> V2 -> V3 schema and must never create or update it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Development-only facilities stay disabled unless the H2 development profile
# is used explicitly.
spring.h2.console.enabled=false
app.seed-data.enabled=false
