spring.application.name=HealthAITracker
server.port=8080
app.cors.allowed-origins=http://localhost:5173
spring.jackson.deserialization.accept-float-as-int=false

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/healthtracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The populated development database is not Flyway-managed yet. An isolated
# clean-database profile enables Flyway for migration verification only.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# The H2 console and its relaxed frame/CSRF rules are development-only opt-ins.
spring.h2.console.enabled=${HEALTHAITRACKER_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Local HTTP uses Secure=false. Production HTTPS must set this to true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HEALTHAITRACKER_SESSION_COOKIE_SECURE:false}

# Development seed data is opt-in so an ordinary production-style start remains empty.
# Enable locally with HEALTHAITRACKER_SEED_DATA_ENABLED=true. Account records are
# created only when HEALTHAITRACKER_SEED_ACCOUNT_PASSWORD is also supplied.
app.seed-data.enabled=${HEALTHAITRACKER_SEED_DATA_ENABLED:false}
app.seed-data.account-password=${HEALTHAITRACKER_SEED_ACCOUNT_PASSWORD:}
